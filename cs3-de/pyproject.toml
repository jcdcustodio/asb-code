[project]
name = "asb-cs3"
version = "0.2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "polars>=2.0.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "python-decouple>=3.8",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
]

[dependency-groups]
dev = [
    "ensurepath>=0.2.6",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.uv]
python-preference = "system"
default-groups = "all"

[tool.ruff.lint]
ignore = ["F401", "F403", "F405"]
