[project]
name = "asb-cs3"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "polars>=2.0.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "python-decouple>=3.8",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
]

[dependency-groups]
dev = [
    "ensurepath>=0.2.6",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
python-preference = "system"
default-groups = "all"

[tool.ruff.lint]
ignore = ["F401", "F403", "F405"]
