[project]
name = "asb-cs4"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb==2.0.0",
    "kagglehub==1.0.3",
    "python-decouple==3.8",
    "python-dotenv==1.2.4",
    "tqdm>=4.70.1",
]

[tool.uv]
python-preference = "system"
default-groups = "all"

[tool.ruff.lint]
ignore = ["F401", "F403", "F405"]
